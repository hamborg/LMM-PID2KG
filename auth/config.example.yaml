# Template for auth/config.yaml. Copy it:
#
#     cp auth/config.example.yaml auth/config.yaml
#
# API keys do NOT go in this file. Put them in a .env file in the project root
# (gitignored; run the framework from the project root so it is found):
#
#     GEMINI_API_KEY=...
#     OPENAI_API_KEY=...
#
# The ${VAR} references below are replaced with those values when the config is
# loaded. A variable already set in the shell takes precedence over .env. A real
# key typed directly into api_key wins over both, but avoid that: this folder is
# synced to OneDrive. Placeholder values (YOUR_..., <...>, CHANGEME, REPLACE_ME)
# count as "not set" and fall back to the environment variable.

default_provider: gemini  # or openai

gemini:
  ### Gemini models: https://ai.google.dev/gemini-api/docs/models
  # Leave blank to use the GEMINI_API_KEY environment variable.
  api_key: ${GEMINI_API_KEY}  # read from .env (copy the variable names, add your keys)
  model: gemini-3.1-pro-preview
  temperature: 0.0
  thinking_level: "high"

openai:
  # Leave blank to use the OPENAI_API_KEY environment variable.
  api_key: ${OPENAI_API_KEY}  # read from .env
  model: gpt-4.1-nano
  temperature: 0.0
  top_p: 1.0 # not applicable for reasoning models
